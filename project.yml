name: Together
options:
  bundleIdPrefix: app.smart-note
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9GR42Q72Q6
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
targets:
  Together:
    type: application
    platform: iOS
    sources:
      - path: Together
    info:
      path: Together/Info.plist
      properties:
        # Where the API lives — set per configuration by API_BASE_URL below; read by APIConfig.baseURL.
        APIBaseURL: $(API_BASE_URL)
        # Only HTTPS/TLS from the OS — exempt; skips the export compliance question in App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Versions come from MARKETING_VERSION / CURRENT_PROJECT_VERSION (bump the build number per upload).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Together/Together.entitlements
      properties:
        # Xcode re-signs with the distribution profile on export, which turns this into "production".
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smart-note.together
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Together
        INFOPLIST_KEY_NSCameraUsageDescription: Together uses the camera to scan grocery receipts. The photo is sent to read the receipt and isn’t kept.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          API_BASE_URL: http://localhost:8080
        Release:
          # The Railway public domain of the API service (back/, production).
          API_BASE_URL: https://api-production-c95d4824.up.railway.app
  TogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogetherTests
    dependencies:
      - target: Together
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smart-note.together.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Together.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Together"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TogetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TogetherUITests
    dependencies:
      - target: Together
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smart-note.together.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Together
schemes:
  Together:
    build:
      targets:
        Together: all
        TogetherTests: [test]
        TogetherUITests: [test]
    test:
      targets:
        - TogetherTests
        - TogetherUITests
      gatherCoverageData: false
