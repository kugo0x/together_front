name: Together
options:
  bundleIdPrefix: app.together
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
targets:
  Together:
    type: application
    platform: iOS
    sources:
      - path: Together
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.together.Together
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Together
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  TogetherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TogetherTests
    dependencies:
      - target: Together
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.together.TogetherTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Together.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Together"
        BUNDLE_LOADER: "$(TEST_HOST)"
  TogetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TogetherUITests
    dependencies:
      - target: Together
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.together.TogetherUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Together
schemes:
  Together:
    build:
      targets:
        Together: all
        TogetherTests: [test]
        TogetherUITests: [test]
    test:
      targets:
        - TogetherTests
        - TogetherUITests
      gatherCoverageData: false
